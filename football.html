<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Watch live football matches and football content on Deeprowss."
  >

  <title>
    Football | Deeprowss
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <!-- =========================
       HEADER
  ========================== -->

  <header class="site-header">

    <div class="container nav-wrap">


      <a
        href="index.html"
        class="brand"
        aria-label="Deeprowss Home"
      >

        <span class="brand-mark">
          D
        </span>

        <span>
          Deeprowss<span>.</span>
        </span>

      </a>


      <nav
        class="main-nav"
        id="mainNav"
        aria-label="Main navigation"
      >

        <a href="index.html">
          Home
        </a>

        <a href="football.html">
          Football
        </a>

        <a href="highlights.html">
          Highlights
        </a>

        <a href="movies.html">
          Movies
        </a>

      </nav>


      <div class="nav-search">

        <input
          type="search"
          placeholder="Search"
          aria-label="Search"
          id="siteSearch"
        >

        <span aria-hidden="true">
          ⌕
        </span>

      </div>


      <button
        type="button"
        class="menu-toggle"
        id="menuToggle"
        aria-label="Open navigation"
        aria-expanded="false"
      >
        ☰
      </button>


    </div>

  </header>



  <!-- =========================
       PAGE HERO
  ========================== -->

  <main>


    <section class="page-hero">

      <div class="container">

        <p class="eyebrow">
          DEEPROWSS SPORTS
        </p>


        <h1>
          Football
        </h1>


        <p>
          Watch live football matches and upcoming games.
        </p>

      </div>

    </section>



    <!-- =========================
         ALL FOOTBALL POSTS
    ========================== -->

    <section class="section">

      <div class="container">


        <div class="section-heading">

          <div>

            <p class="eyebrow">
              LIVE &amp; UPCOMING
            </p>

            <h2>
              Football Matches
            </h2>

          </div>

        </div>


        <div
          id="allPosts"
          class="all-posts-grid"
        >

          <div class="loading">
            Loading football posts...
          </div>

        </div>


      </div>

    </section>


  </main>



  <!-- =========================
       FOOTER
  ========================== -->

  <footer class="footer">

    <div class="container footer-wrap">


      <div>

        <strong>
          Deeprowss<span>.</span>
        </strong>

        <p>
          Football, highlights and movies.
        </p>

      </div>


      <div class="footer-links">

        <a href="index.html">
          Home
        </a>

        <a href="football.html">
          Football
        </a>

        <a href="highlights.html">
          Highlights
        </a>

        <a href="movies.html">
          Movies
        </a>

      </div>


      <p class="copyright">

        &copy;
        <span id="year"></span>
        Deeprowss. All rights reserved.

      </p>


    </div>

  </footer>



  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script src="all-posts.js"></script>


  <script>

    /*
     * Copyright year
     */

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        var year =
          document.getElementById("year");


        if (year) {

          year.textContent =
            new Date().getFullYear();

        }

      }
    );

  </script>


</body>

</html>
