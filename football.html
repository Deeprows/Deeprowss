<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Watch live football matches and upcoming games on Deeprowss."
  >

  <title>Football | Deeprowss</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <!-- =========================
       CLOUDFLARE WEB ANALYTICS
  ========================= -->

  <script
    type="module"
    src="https://static.cloudflareinsights.com/beacon.min.js"
    data-cf-beacon='{"token":"a3bd44ed647d47ceb9d9b73713ad1763"}'
  ></script>

  <!-- End Cloudflare Web Analytics -->

</head>


<body>


  <!-- =========================
       HEADER
  ========================== -->

  <header class="site-header">

    <div class="container nav-wrap">


      <!-- LOGO -->

      <a
        href="index.html"
        class="brand"
        aria-label="Deeprowss Home"
      >

        <span class="brand-mark">
          D
        </span>

        <span>
          DEE<span>PROWSS</span>
        </span>

      </a>



      <!-- MOBILE MENU -->

      <button
        type="button"
        class="menu-toggle"
        id="menuToggle"
        aria-label="Open navigation"
        aria-expanded="false"
        aria-controls="mainNav"
      >
        ☰
      </button>



      <!-- NAVIGATION -->

      <nav
        class="main-nav"
        id="mainNav"
        aria-label="Main navigation"
      >

        <a href="index.html">
          Home
        </a>

        <a
          href="football.html"
          aria-current="page"
        >
          Football Live
        </a>

        <a href="highlights.html">
          Highlights
        </a>

        <a href="movies.html">
          Movies
        </a>

        <a href="tv.html">
          TV Channels
        </a>

      </nav>



      <!-- SEARCH -->

      <div class="nav-search">

        <label
          class="sr-only"
          for="siteSearch"
        >
          Search Deeprowss
        </label>

        <input
          id="siteSearch"
          type="search"
          placeholder="Search..."
          autocomplete="off"
          spellcheck="false"
          aria-label="Search Deeprowss"
        >

        <span aria-hidden="true">
          ⌕
        </span>

      </div>


    </div>

  </header>



  <!-- =========================
       MAIN
  ========================== -->

  <main>


    <!-- =========================
         PAGE HERO
    ========================== -->

    <section class="page-hero">

      <div class="container">

        <p class="eyebrow">
          DEEPROWSS SPORTS
        </p>

        <h1>
          Football
        </h1>

        <p>
          Watch live football matches and upcoming games.
        </p>

      </div>

    </section>



    <!-- =========================
         SEARCH STATUS
    ========================== -->

    <section
      class="search-section"
      aria-live="polite"
    >

      <div class="container">

        <div id="searchStatus"></div>

      </div>

    </section>



    <!-- =========================
         FOOTBALL POSTS
    ========================== -->

    <section class="section">

      <div class="container">


        <div class="section-heading">

          <div>

            <p class="eyebrow">
              LIVE &amp; UPCOMING
            </p>

            <h2>
              Football Matches
            </h2>

          </div>

        </div>



        <div
          id="livePosts"
          class="all-posts-grid"
        >

          <div class="loading">
            Loading football posts...
          </div>

        </div>


      </div>

    </section>


  </main>



  <!-- =========================
       VIDEO MODAL
  ========================== -->

  <div
    class="modal"
    id="embedModal"
    aria-hidden="true"
  >

    <!-- BACKDROP -->

    <div
      class="modal-backdrop"
      id="modalBackdrop"
    ></div>



    <!-- MODAL BOX -->

    <div
      class="modal-box"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
    >


      <!-- CLOSE BUTTON -->

      <button
        type="button"
        class="modal-close"
        id="modalClose"
        aria-label="Close video"
        title="Close video"
      >
        ×
      </button>



      <h2 id="modalTitle">
        Video
      </h2>



      <!-- VIDEO -->

      <div
        class="embed-area"
        id="embedArea"
      >

        <div class="embed-placeholder">

          <strong>
            Select a match
          </strong>

          <span class="embed-note">
            The football player will appear here.
          </span>

        </div>

      </div>


    </div>

  </div>



  <!-- =========================
       NO RESULTS
  ========================== -->

  <div
    class="no-results"
    id="noResults"
    role="status"
    aria-live="polite"
  >
    No matching content found.
  </div>



  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script src="script.js"></script>


  <!-- =========================
       EXTRA MODAL SAFETY
  ========================== -->

  <script>

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        var closeButton =
          document.getElementById("modalClose");

        var backdrop =
          document.getElementById("modalBackdrop");


        /*
         * Make the X button independently
         * close the iframe modal.
         */

        if (closeButton) {

          closeButton.addEventListener(
            "click",
            function (event) {

              event.preventDefault();
              event.stopPropagation();

              if (typeof window.closeEmbed === "function") {
                window.closeEmbed();
              }

            }
          );

        }


        /*
         * Make the dark backdrop close
         * the modal as well.
         */

        if (backdrop) {

          backdrop.addEventListener(
            "click",
            function () {

              if (typeof window.closeEmbed === "function") {
                window.closeEmbed();
              }

            }
          );

        }

      }
    );

  </script>


</body>

</html>
