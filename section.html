<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Deeprowss content">

  <title>Deeprowss</title>

  <link rel="stylesheet" href="style.css">

</head>


<body>


<header class="site-header">

  <div class="container nav-wrap">

    <a
      class="brand"
      href="index.html"
      aria-label="Deeprowss home">

      <span class="brand-mark">D</span>

      <span>
        DEE<span>PROWSS</span>
      </span>

    </a>


    <button
      class="menu-toggle"
      id="menuToggle"
      aria-label="Open menu">

      ☰

    </button>


    <nav
      class="main-nav"
      id="mainNav">

      <a href="index.html">
        Home
      </a>

      <a href="index.html#live">
        Football Live
      </a>

      <a href="index.html#highlights">
        Highlights
      </a>

      <a href="index.html#movies">
        Movies
      </a>

    </nav>

  </div>

</header>



<main>

  <section class="section">

    <div class="container">

      <a
        href="index.html"
        class="section-link">

        ← Back to Deeprowss

      </a>


      <div
        class="section-heading"
        style="margin-top:25px;">

        <div>

          <p
            class="eyebrow"
            id="pageEyebrow">

            DEEPROWSS

          </p>

          <h1 id="pageTitle">
            All Content
          </h1>

        </div>

      </div>


      <div
        id="allPosts"
        class="all-posts-grid">

        <div class="loading">
          Loading...
        </div>

      </div>

    </div>

  </section>

</main>



<footer class="footer">

  <div class="container footer-wrap">

    <div>

      <strong>
        DEE<span>PROWSS</span>
      </strong>

      <p>
        Football • Highlights • Entertainment
      </p>

    </div>

  </div>

</footer>



<script src="section.js"></script>

</body>

</html>
